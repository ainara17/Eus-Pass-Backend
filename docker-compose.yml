services:

  app:
    container_name: ${APP_HOST}
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT}:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo



  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE: ${MONGO_DB}
 
    volumes:
      - mongo_data:/data/db
   


volumes:
  mongo_data: